services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: review
      POSTGRES_PASSWORD: review
      POSTGRES_DB: review_desk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d review_desk"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://review:review@db:5432/review_desk
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me}
      # Leave ANTHROPIC_API_KEY empty to run in demo mode with the fake provider.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FAKE_TOKEN_DELAY_MS: 25
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
